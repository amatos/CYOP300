{% extends "base.html" %}
{% block title %}Login – Lab 7{% endblock %}

{% block content %}
<div class="post-article">
    <h1>Login</h1>

    {% if message %}
  <p class="message_category">{{ message }}</p>
    {% endif %}

    <form method="post" action="/login">
        <div>
            <label for="email">e-mail address</label><br />
            <input
                type="text"
                id="username"
                name="username"
                required
                autocomplete="email"
            />
        </div>

        <div>
            <label for="password">Password</label><br />
            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            />
        </div>

        <div>
            <button type="submit">Log in</button>
        </div>
    </form>

  <p>
    <a href="/forgot_password">Forgot your password</a>?
  </p>
  <p>
    Need an account?
    <a href="/create_account">Create Account instead</a>.
  </p>
    <p>
        <a href="/lab7/source/static" class="back-link">&larr; Return to top of site.</a>
    </p>
</div>
{% endblock %}
